name: Android CI Build and Test

# Runs automatically on every push and pull request to main, so the app is verified
# to build and pass its unit tests on a clean machine, not just on one developer's laptop.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: kasi-marketplace-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
